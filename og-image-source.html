<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300&family=Manrope:wght@500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#F7F3EA;font-family:'Manrope',sans-serif;position:relative;color:#123F5A}
.pool{position:absolute;border-radius:50%;filter:blur(70px)}
.a{width:700px;height:700px;left:-220px;bottom:-330px;background:#BFE3E6;opacity:.7}
.b{width:520px;height:520px;right:-120px;top:-260px;background:#FBE3D0;opacity:.95}
.c{width:420px;height:420px;right:120px;bottom:-260px;background:#D3ECE3;opacity:.7}
.wrap{position:absolute;inset:0;padding:74px 84px;display:flex;flex-direction:column;justify-content:space-between}
.wm{display:flex;align-items:center;gap:14px;font-family:'Fraunces',serif;font-size:34px;font-weight:500}
.mark{display:grid;gap:6px}.mark i{display:block;height:6px;border-radius:3px;background:#2C8C9E;width:34px}.mark i+i{background:#F08A3E;width:24px;justify-self:end}
h1{font-family:'Fraunces',serif;font-variation-settings:'opsz' 144;font-weight:400;font-size:92px;line-height:1.02;letter-spacing:-.025em;margin:0}
h1 em{font-style:italic;font-weight:300;color:#1E6E7E}
.tag{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:#B8996A}
svg{position:absolute;right:96px;bottom:70px}
</style></head><body>
<span class="pool a"></span><span class="pool b"></span><span class="pool c"></span>
<div class="wrap">
  <div class="wm"><span class="mark"><i></i><i></i></span>Friction</div>
  <h1>Something isn't<br>working.<br><em>Let's find out why.</em></h1>
  <div class="tag">Find what's getting in the way</div>
</div>
<svg width="300" height="270" viewBox="0 0 300 270"><line x1="150" y1="30" x2="270" y2="235" stroke="#B8996A" stroke-width="3" opacity=".5"/><line x1="150" y1="30" x2="30" y2="235" stroke="#B8996A" stroke-width="3" opacity=".5"/><line x1="30" y1="235" x2="270" y2="235" stroke="#F08A3E" stroke-width="7" stroke-linecap="round"/><circle cx="150" cy="30" r="26" fill="#F08A3E" opacity=".22"/><circle cx="150" cy="30" r="8" fill="#F08A3E"/><circle cx="270" cy="235" r="34" fill="#2C8C9E" opacity=".22"/><circle cx="270" cy="235" r="8" fill="#2C8C9E"/><circle cx="30" cy="235" r="22" fill="#3E8A6A" opacity=".22"/><circle cx="30" cy="235" r="8" fill="#3E8A6A"/><circle cx="165" cy="235" r="30" fill="none" stroke="#F08A3E" stroke-width="2" opacity=".35"/><circle cx="165" cy="235" r="14" fill="#F08A3E" stroke="#fff" stroke-width="5"/></svg>
</body></html>
